# Orca worktree lifecycle for Kame Crew.
# Sticky per-worktree Next port (3400-3499) and a UI tab.

scripts:
  setup: |
    bun install
    cp -n "$ORCA_ROOT_PATH/.env.local" .env.local 2>/dev/null || true
  archive: |
    bash scripts/dev/archive-worktree-ui.sh

setupAgentStartupPolicy: wait-for-setup

defaultTabs:
  - title: UI
    command: bun run ui
